<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de portfolio</title>
<meta name="description" content="Générez un portfolio personnel statique (HTML/CSS) prêt à déployer, à partir d'un formulaire.">
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --panel-2: #1d2130;
    --border: #2a2f3f;
    --text: #e8eaf0;
    --text-dim: #9aa0b4;
    --accent: #6d5ef8;
    --accent-2: #34d3a3;
    --danger: #f2545b;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); }

  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(15, 17, 21, 0.9);
    backdrop-filter: blur(6px);
    z-index: 20;
    flex-wrap: wrap;
  }
  header.topbar h1 {
    font-size: 1.1rem;
    margin: 0;
    font-weight: 600;
  }
  header.topbar h1 span { color: var(--accent); }
  .topbar-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .app {
    display: grid;
    grid-template-columns: minmax(320px, 460px) 1fr;
    gap: 0;
    min-height: calc(100vh - 61px);
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
  }

  .editor {
    padding: 1.5rem;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 61px);
  }
  @media (max-width: 900px) {
    .editor { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
  }

  .preview-pane {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: #0b0d11;
  }
  .preview-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .preview-toolbar .viewport-toggle {
    display: flex;
    gap: 0.25rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.25rem;
  }
  .viewport-toggle button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.35rem 0.7rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .viewport-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .preview-frame-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: auto;
    background:
      linear-gradient(45deg, #14161c 25%, transparent 25%),
      linear-gradient(-45deg, #14161c 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #14161c 75%),
      linear-gradient(-45deg, transparent 75%, #14161c 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }
  #preview {
    width: 100%;
    max-width: 1100px;
    height: 78vh;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    transition: max-width 0.2s ease;
  }
  #preview.mobile { max-width: 390px; }
  #preview.tablet { max-width: 700px; }

  fieldset {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    margin: 0 0 1.25rem 0;
    background: var(--panel);
  }
  legend {
    padding: 0 0.4rem;
    font-weight: 600;
    color: var(--text);
    font-size: 0.95rem;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin: 0.7rem 0 0.3rem;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"],
  input[type="url"],
  input[type="email"],
  textarea,
  input[type="color"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.65rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  input[type="color"] { padding: 0.2rem; height: 2.4rem; cursor: pointer; }
  textarea { resize: vertical; min-height: 4.5rem; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 0.6rem; }
  .row > * { flex: 1; }
  .field-hint { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #7c6ffb; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px dashed var(--border); width: 100%; }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid transparent; padding: 0.3rem 0.5rem; font-size: 0.78rem; }
  .btn-danger:hover { background: rgba(242, 84, 91, 0.1); }
  .btn-icon { padding: 0.3rem 0.55rem; }

  .tag-input-row { display: flex; gap: 0.4rem; }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
    list-style: none;
    padding: 0;
  }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.35rem 0.25rem 0.6rem;
    border-radius: 999px;
    font-size: 0.78rem;
  }
  .tag-chip button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0 0.2rem;
    font-size: 0.85rem;
    line-height: 1;
    border-radius: 999px;
  }
  .tag-chip button:hover { color: var(--danger); }

  .project-card-editor {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem;
    background: var(--panel-2);
    margin-bottom: 0.85rem;
  }
  .project-card-editor .project-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .project-card-editor .project-head strong { font-size: 0.85rem; color: var(--text-dim); }

  .empty-state {
    font-size: 0.8rem;
    color: var(--text-dim);
    padding: 0.5rem 0;
  }

  footer.credit {
    text-align: center;
    padding: 1rem;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>Générateur de <span>portfolio</span></h1>
  <div class="topbar-actions">
    <button class="btn-secondary" id="btn-download-html">Télécharger index.html</button>
    <button class="btn-secondary" id="btn-download-css">Télécharger style.css</button>
    <button class="btn-primary" id="btn-download-zip">Générer le code (.zip)</button>
  </div>
</header>

<div class="app">
  <!-- ========== FORM ========== -->
  <section class="editor" id="editor">
    <fieldset>
      <legend>Profil</legend>

      <label for="f-name">Nom complet</label>
      <input type="text" id="f-name" placeholder="Jane Dupont">

      <label for="f-title">Titre / rôle</label>
      <input type="text" id="f-title" placeholder="Développeuse Front-End">

      <label for="f-bio">Bio courte</label>
      <textarea id="f-bio" placeholder="Quelques phrases sur vous, votre parcours et ce que vous aimez construire."></textarea>

      <label for="f-photo-url">Photo — URL (optionnel)</label>
      <input type="url" id="f-photo-url" placeholder="https://.../photo.jpg">
      <label for="f-photo-file">Photo — fichier (optionnel, prioritaire sur l'URL)</label>
      <input type="file" id="f-photo-file" accept="image/*">
      <p class="field-hint">Sans photo, un avatar avec vos initiales est généré automatiquement.</p>

      <label for="f-accent">Couleur d'accent</label>
      <input type="color" id="f-accent" value="#6d5ef8">
    </fieldset>

    <fieldset>
      <legend>Liens</legend>
      <label for="f-github">GitHub</label>
      <input type="url" id="f-github" placeholder="https://github.com/votre-pseudo">
      <label for="f-linkedin">LinkedIn</label>
      <input type="url" id="f-linkedin" placeholder="https://linkedin.com/in/votre-profil">
      <label for="f-email">Email de contact</label>
      <input type="email" id="f-email" placeholder="vous@exemple.com">
    </fieldset>

    <fieldset>
      <legend>Compétences</legend>
      <div class="tag-input-row">
        <input type="text" id="f-skill-input" placeholder="Ex : JavaScript">
        <button class="btn-secondary" id="btn-add-skill">Ajouter</button>
      </div>
      <ul class="tag-list" id="skills-list"></ul>
    </fieldset>

    <fieldset>
      <legend>Projets</legend>
      <div id="projects-list"></div>
      <button class="btn-ghost" id="btn-add-project">+ Ajouter un projet</button>
    </fieldset>
  </section>

  <!-- ========== PREVIEW ========== -->
  <section class="preview-pane">
    <div class="preview-toolbar">
      <strong style="font-size:0.85rem;color:var(--text-dim);">Aperçu en direct</strong>
      <div class="viewport-toggle" id="viewport-toggle">
        <button data-size="mobile">Mobile</button>
        <button data-size="tablet">Tablette</button>
        <button data-size="desktop" class="active">Desktop</button>
      </div>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="preview" title="Aperçu du portfolio"></iframe>
    </div>
  </section>
</div>

<footer class="credit">Tout est généré et exécuté dans votre navigateur — aucune donnée n'est envoyée à un serveur.</footer>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------------
   * State
   * ------------------------------------------------------------------- */
  const state = {
    profile: {
      name: "",
      title: "",
      bio: "",
      photoUrl: "",
      photoDataUrl: "",
      accent: "#6d5ef8"
    },
    social: {
      github: "",
      linkedin: "",
      email: ""
    },
    skills: [],
    projects: []
  };

  let projectSeq = 0;
  function newProject() {
    projectSeq += 1;
    return { id: "p" + projectSeq, name: "", description: "", tech: [], github: "", demo: "" };
  }
  state.projects.push(newProject());

  /* ---------------------------------------------------------------------
   * Helpers
   * ------------------------------------------------------------------- */
  function esc(str) {
    return String(str || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function initials(name) {
    const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function safeUrl(url) {
    const u = String(url || "").trim();
    if (!u) return "";
    if (/^(https?:|mailto:)/i.test(u)) return u;
    return "https://" + u;
  }

  function slug(str) {
    return String(str || "")
      .toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "");
  }

  /* ---------------------------------------------------------------------
   * Generated portfolio: HTML + CSS builders
   * (single source of truth, used for both live preview and export)
   * ------------------------------------------------------------------- */
  function buildCSS() {
    const accent = state.profile.accent || "#6d5ef8";
    return `/* -------------------------------------------------------------
 * style.css - Portfolio genere automatiquement
 * Palette neutre + une couleur d'accent configurable ci-dessous.
 * ------------------------------------------------------------- */

:root {
  --accent: ${accent};
  --bg: #ffffff;
  --bg-alt: #f6f7f9;
  --text: #1c1e21;
  --text-dim: #5c6270;
  --border: #e4e6ea;
  --radius: 12px;
  --max-width: 1100px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.55;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

img { max-width: 100%; display: block; }

.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 1.25rem;
}

/* ---------- Header / profil ---------- */
.hero {
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  padding: 3rem 0 2.5rem;
}
.hero-content { text-align: center; }

.avatar {
  width: 128px;
  height: 128px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 1.25rem;
  border: 3px solid var(--bg);
  box-shadow: 0 0 0 1px var(--border);
}
.avatar-initials {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: #fff;
  font-size: 2.2rem;
  font-weight: 600;
}

.hero h1 { margin: 0 0 0.25rem; font-size: 1.9rem; }
.hero .role { margin: 0 0 1rem; color: var(--accent); font-weight: 600; }
.hero .bio { max-width: 560px; margin: 0 auto 1.25rem; color: var(--text-dim); }

.socials {
  display: flex;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.socials a {
  border: 1px solid var(--border);
  padding: 0.45rem 0.9rem;
  border-radius: 999px;
  font-size: 0.9rem;
  color: var(--text);
}
.socials a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

/* ---------- Sections generiques ---------- */
.section { padding: 3rem 0; }
.section.alt { background: var(--bg-alt); }
.section h2 {
  font-size: 1.4rem;
  margin: 0 0 1.5rem;
  text-align: center;
}

/* ---------- Projets ---------- */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.25rem;
}
.project-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.project-card h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
.project-card p { margin: 0 0 0.9rem; color: var(--text-dim); font-size: 0.92rem; flex: 1; }

.tags {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0;
  margin: 0 0 0.9rem;
}
.tags li {
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.2rem 0.65rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.project-links { display: flex; gap: 0.9rem; }
.project-links a { font-size: 0.88rem; font-weight: 600; }

/* ---------- Competences ---------- */
.skills-list { justify-content: center; }
.skills-list li {
  background: var(--bg);
  font-size: 0.85rem;
  padding: 0.35rem 0.85rem;
}

/* ---------- Contact ---------- */
#contact { text-align: center; }
#contact p { color: var(--text-dim); }

/* ---------- Footer ---------- */
footer {
  border-top: 1px solid var(--border);
  padding: 1.5rem 0;
}
footer p {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.82rem;
  margin: 0;
}

/* ---------- Responsive (mobile-first: la mise en page ci-dessus
   s'empile deja verticalement par defaut; ajustements ecrans larges) ---------- */
@media (min-width: 640px) {
  .hero { padding: 4rem 0 3rem; }
  .hero h1 { font-size: 2.4rem; }
}
`;
  }

  function buildHTML() {
    const p = state.profile;
    const name = p.name || "Votre nom";
    const title = p.title || "Votre titre ou role";
    const year = new Date().getFullYear();

    const photoSrc = p.photoDataUrl || (p.photoUrl ? safeUrl(p.photoUrl) : "");
    const avatarMarkup = photoSrc
      ? `<img class="avatar" src="${esc(photoSrc)}" alt="Photo de ${esc(name)}">`
      : `<div class="avatar avatar-initials" role="img" aria-label="Initiales de ${esc(name)}">${esc(initials(name))}</div>`;

    const socialLinks = [];
    if (state.social.github) socialLinks.push(`<a href="${esc(safeUrl(state.social.github))}" target="_blank" rel="noopener">GitHub</a>`);
    if (state.social.linkedin) socialLinks.push(`<a href="${esc(safeUrl(state.social.linkedin))}" target="_blank" rel="noopener">LinkedIn</a>`);
    if (state.social.email) socialLinks.push(`<a href="mailto:${esc(state.social.email)}">Email</a>`);
    const socialsMarkup = socialLinks.length
      ? `<div class="socials">\n      ${socialLinks.join("\n      ")}\n    </div>`
      : "";

    const projectsMarkup = state.projects
      .filter(function (proj) { return proj.name.trim() || proj.description.trim(); })
      .map(function (proj) {
        const tagsMarkup = proj.tech.map(function (t) { return `<li>${esc(t)}</li>`; }).join("");
        const links = [];
        if (proj.github) links.push(`<a href="${esc(safeUrl(proj.github))}" target="_blank" rel="noopener">Code source</a>`);
        if (proj.demo) links.push(`<a href="${esc(safeUrl(proj.demo))}" target="_blank" rel="noopener">Demo</a>`);
        return `      <article class="project-card">
        <h3>${esc(proj.name || "Projet sans nom")}</h3>
        <p>${esc(proj.description)}</p>
        ${tagsMarkup ? `<ul class="tags">${tagsMarkup}</ul>` : ""}
        ${links.length ? `<div class="project-links">${links.join("\n          ")}</div>` : ""}
      </article>`;
      })
      .join("\n");

    const skillsMarkup = state.skills.map(function (s) { return `      <li>${esc(s)}</li>`; }).join("\n");

    return `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${esc(name)} — Portfolio</title>
  <meta name="description" content="${esc((p.bio || "Portfolio personnel de " + name).slice(0, 155))}">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- En-tete / profil -->
  <header class="hero">
    <div class="container hero-content">
      ${avatarMarkup}
      <h1>${esc(name)}</h1>
      <p class="role">${esc(title)}</p>
      ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ""}
      ${socialsMarkup}
    </div>
  </header>

  <main>
    <!-- Projets -->
    <section id="projects" class="section">
      <div class="container">
        <h2>Projets</h2>
        ${projectsMarkup
          ? `<div class="projects-grid">\n${projectsMarkup}\n        </div>`
          : `<p style="text-align:center;color:var(--text-dim);">Aucun projet renseigne pour le moment.</p>`}
      </div>
    </section>

    <!-- Competences -->
    ${state.skills.length ? `<section id="skills" class="section alt">
      <div class="container">
        <h2>Competences</h2>
        <ul class="tags skills-list">
${skillsMarkup}
        </ul>
      </div>
    </section>` : ""}

    <!-- Contact -->
    <section id="contact" class="section">
      <div class="container">
        <h2>Contact</h2>
        <p>N'hesitez pas a me contacter.</p>
        ${socialsMarkup}
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; ${year} ${esc(name)}. Tous droits reserves.</p>
    </div>
  </footer>

</body>
</html>
`;
  }

  /* ---------------------------------------------------------------------
   * Live preview
   * ------------------------------------------------------------------- */
  function renderPreview() {
    const html = buildHTML();
    const css = buildCSS();
    const inlined = html.replace(
      '<link rel="stylesheet" href="style.css">',
      `<style>\n${css}\n</style>`
    );
    document.getElementById("preview").srcdoc = inlined;
  }

  /* ---------------------------------------------------------------------
   * Form <-> state wiring
   * ------------------------------------------------------------------- */
  function bindSimpleField(id, target, key) {
    const el = document.getElementById(id);
    el.addEventListener("input", function () {
      target[key] = el.value;
      renderPreview();
    });
  }

  bindSimpleField("f-name", state.profile, "name");
  bindSimpleField("f-title", state.profile, "title");
  bindSimpleField("f-bio", state.profile, "bio");
  bindSimpleField("f-photo-url", state.profile, "photoUrl");
  bindSimpleField("f-accent", state.profile, "accent");
  bindSimpleField("f-github", state.social, "github");
  bindSimpleField("f-linkedin", state.social, "linkedin");
  bindSimpleField("f-email", state.social, "email");

  document.getElementById("f-photo-file").addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) {
      state.profile.photoDataUrl = "";
      renderPreview();
      return;
    }
    const reader = new FileReader();
    reader.onload = function () {
      state.profile.photoDataUrl = reader.result;
      renderPreview();
    };
    reader.readAsDataURL(file);
  });

  /* ---- Skills ---- */
  function renderSkills() {
    const list = document.getElementById("skills-list");
    list.innerHTML = "";
    if (state.skills.length === 0) {
      const li = document.createElement("li");
      li.className = "empty-state";
      li.textContent = "Aucune competence ajoutee.";
      list.appendChild(li);
      return;
    }
    state.skills.forEach(function (skill, idx) {
      const li = document.createElement("li");
      li.className = "tag-chip";
      const span = document.createElement("span");
      span.textContent = skill;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("aria-label", "Supprimer " + skill);
      btn.textContent = "×";
      btn.addEventListener("click", function () {
        state.skills.splice(idx, 1);
        renderSkills();
        renderPreview();
      });
      li.appendChild(span);
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  function addSkillFromInput() {
    const input = document.getElementById("f-skill-input");
    const value = input.value.trim();
    if (!value) return;
    state.skills.push(value);
    input.value = "";
    renderSkills();
    renderPreview();
    input.focus();
  }

  document.getElementById("btn-add-skill").addEventListener("click", addSkillFromInput);
  document.getElementById("f-skill-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      addSkillFromInput();
    }
  });

  /* ---- Projects ---- */
  function renderProjects() {
    const list = document.getElementById("projects-list");
    list.innerHTML = "";

    if (state.projects.length === 0) {
      const p = document.createElement("p");
      p.className = "empty-state";
      p.textContent = "Aucun projet. Cliquez sur « + Ajouter un projet ».";
      list.appendChild(p);
      return;
    }

    state.projects.forEach(function (proj, index) {
      const card = document.createElement("div");
      card.className = "project-card-editor";

      card.innerHTML = `
        <div class="project-head">
          <strong>Projet ${index + 1}</strong>
          <button type="button" class="btn-danger" data-action="remove-project">Supprimer</button>
        </div>
        <label>Nom du projet</label>
        <input type="text" data-field="name" placeholder="Nom du projet" value="${esc(proj.name)}">
        <label>Description courte</label>
        <textarea data-field="description" placeholder="En une ou deux phrases...">${esc(proj.description)}</textarea>
        <label>Lien GitHub</label>
        <input type="url" data-field="github" placeholder="https://github.com/..." value="${esc(proj.github)}">
        <label>Lien demo (optionnel)</label>
        <input type="url" data-field="demo" placeholder="https://..." value="${esc(proj.demo)}">
        <label>Technologies</label>
        <div class="tag-input-row">
          <input type="text" data-field="tech-input" placeholder="Ex : React">
          <button type="button" class="btn-secondary" data-action="add-tech">Ajouter</button>
        </div>
        <ul class="tag-list" data-role="tech-list"></ul>
      `;

      // text fields
      ["name", "description", "github", "demo"].forEach(function (field) {
        const el = card.querySelector('[data-field="' + field + '"]');
        el.addEventListener("input", function () {
          proj[field] = el.value;
          renderPreview();
        });
      });

      // tech tags
      function renderTechList() {
        const techList = card.querySelector('[data-role="tech-list"]');
        techList.innerHTML = "";
        proj.tech.forEach(function (tech, techIdx) {
          const li = document.createElement("li");
          li.className = "tag-chip";
          const span = document.createElement("span");
          span.textContent = tech;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "×";
          btn.setAttribute("aria-label", "Supprimer " + tech);
          btn.addEventListener("click", function () {
            proj.tech.splice(techIdx, 1);
            renderTechList();
            renderPreview();
          });
          li.appendChild(span);
          li.appendChild(btn);
          techList.appendChild(li);
        });
      }
      renderTechList();

      const techInput = card.querySelector('[data-field="tech-input"]');
      function addTech() {
        const value = techInput.value.trim();
        if (!value) return;
        proj.tech.push(value);
        techInput.value = "";
        renderTechList();
        renderPreview();
        techInput.focus();
      }
      card.querySelector('[data-action="add-tech"]').addEventListener("click", addTech);
      techInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          addTech();
        }
      });

      card.querySelector('[data-action="remove-project"]').addEventListener("click", function () {
        state.projects.splice(index, 1);
        renderProjects();
        renderPreview();
      });

      list.appendChild(card);
    });
  }

  document.getElementById("btn-add-project").addEventListener("click", function () {
    state.projects.push(newProject());
    renderProjects();
    renderPreview();
  });

  /* ---------------------------------------------------------------------
   * Viewport toggle
   * ------------------------------------------------------------------- */
  document.getElementById("viewport-toggle").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-size]");
    if (!btn) return;
    document.querySelectorAll("#viewport-toggle button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    const preview = document.getElementById("preview");
    preview.classList.remove("mobile", "tablet");
    if (btn.dataset.size === "mobile") preview.classList.add("mobile");
    if (btn.dataset.size === "tablet") preview.classList.add("tablet");
  });

  /* ---------------------------------------------------------------------
   * Minimal ZIP writer (store / no compression) - no external dependency
   * ------------------------------------------------------------------- */
  function crc32(bytes) {
    if (!crc32.table) {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[n] = c >>> 0;
      }
      crc32.table = table;
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ crc32.table[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZip(files) {
    // files: [{ name: string, data: Uint8Array }]
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    files.forEach(function (file) {
      const nameBytes = encoder.encode(file.name);
      const data = file.data;
      const crc = crc32(data);
      const size = data.length;

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0, true);
      local.setUint16(8, 0, true); // no compression
      local.setUint16(10, 0, true);
      local.setUint16(12, 0x21, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, size, true);
      local.setUint32(22, size, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);
      const localBytes = new Uint8Array(local.buffer);

      localParts.push(localBytes, nameBytes, data);

      const central = new DataView(new ArrayBuffer(46));
      central.setUint32(0, 0x02014b50, true);
      central.setUint16(4, 20, true);
      central.setUint16(6, 20, true);
      central.setUint16(8, 0, true);
      central.setUint16(10, 0, true);
      central.setUint16(12, 0, true);
      central.setUint16(14, 0x21, true);
      central.setUint32(16, crc, true);
      central.setUint32(20, size, true);
      central.setUint32(24, size, true);
      central.setUint16(28, nameBytes.length, true);
      central.setUint16(30, 0, true);
      central.setUint16(32, 0, true);
      central.setUint16(34, 0, true);
      central.setUint16(36, 0, true);
      central.setUint32(38, 0, true);
      central.setUint32(42, offset, true);
      const centralBytes = new Uint8Array(central.buffer);

      centralParts.push(centralBytes, nameBytes);

      offset += localBytes.length + nameBytes.length + data.length;
    });

    const centralSize = centralParts.reduce(function (a, b) { return a + b.length; }, 0);
    const centralOffset = offset;

    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, centralOffset, true);
    end.setUint16(20, 0, true);

    const allParts = localParts.concat(centralParts, [new Uint8Array(end.buffer)]);
    const total = allParts.reduce(function (a, b) { return a + b.length; }, 0);
    const result = new Uint8Array(total);
    let pos = 0;
    allParts.forEach(function (part) {
      result.set(part, pos);
      pos += part.length;
    });
    return result;
  }

  /* ---------------------------------------------------------------------
   * Downloads
   * ------------------------------------------------------------------- */
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById("btn-download-html").addEventListener("click", function () {
    triggerDownload(new Blob([buildHTML()], { type: "text/html" }), "index.html");
  });

  document.getElementById("btn-download-css").addEventListener("click", function () {
    triggerDownload(new Blob([buildCSS()], { type: "text/css" }), "style.css");
  });

  document.getElementById("btn-download-zip").addEventListener("click", function () {
    const encoder = new TextEncoder();
    const zipBytes = buildZip([
      { name: "index.html", data: encoder.encode(buildHTML()) },
      { name: "style.css", data: encoder.encode(buildCSS()) }
    ]);
    const filename = (slug(state.profile.name) || "portfolio") + ".zip";
    triggerDownload(new Blob([zipBytes], { type: "application/zip" }), filename);
  });

  /* ---------------------------------------------------------------------
   * Init
   * ------------------------------------------------------------------- */
  renderSkills();
  renderProjects();
  renderPreview();
})();
</script>
</body>
</html>
